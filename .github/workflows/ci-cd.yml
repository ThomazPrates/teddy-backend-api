name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop

env:
  NODE_VERSION: '20'
  DOCKER_IMAGE_NAME: 'teddy-backend-api'

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache node modules
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm install

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Build project
        run: npm run build

      - name: Build Docker image
        run: docker build -t ${{ env.DOCKER_IMAGE_NAME }}:latest .

  deploy:
    name: Deploy Environments
    needs: build-and-test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - environment: dev
            branch: develop
          - environment: prod
            branch: main

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Check branch
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/${{ matrix.branch }}" ]; then
            echo "Skipping deploy for this branch"
            exit 0
          fi

      - name: Get public IP
        run: echo "MY_IP=$(curl -s https://checkip.amazonaws.com)" >> $GITHUB_ENV

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.6.0

      - name: Terraform Init
        run: terraform -chdir=./terraform init -backend-config="env=dev"

      - name: Terraform Plan
        run: |
          terraform -chdir=./terraform plan \
            -var "project_name=${{ secrets.PROJECT_NAME }}" \
            -var "environment=dev" \
            -var "aws_region=${{ secrets.AWS_REGION }}" \
            -var "db_username=${{ secrets.DB_USERNAME }}" \
            -var "db_password=${{ secrets.DB_PASSWORD }}" \
            -var "my_ip=${{ secrets.MY_IP }}" \
            -var-file=terraform/dev.tfvars

      - name: Terraform Apply
        run: |
          terraform apply -auto-approve \
            -var "project_name=${{ secrets.PROJECT_NAME }}" \
            -var "environment=${{ matrix.environment }}" \
            -var "aws_region=${{ secrets.AWS_REGION }}" \
            -var "db_username=${{ secrets.DB_USERNAME }}" \
            -var "db_password=${{ secrets.DB_PASSWORD }}" \
            -var "my_ip=${{ secrets.MY_IP }}" \
            -var-file=terraform/${{ matrix.environment }}.tfvars ./terraform

      - name: Build Docker image
        run: docker build -t ${{ env.DOCKER_IMAGE_NAME }}:${{ matrix.environment }} .

      - name: Run Docker container
        run: |
          docker stop ${{ env.DOCKER_IMAGE_NAME }}-${{ matrix.environment }} || true
          docker rm ${{ env.DOCKER_IMAGE_NAME }}-${{ matrix.environment }} || true
          docker run -d --name ${{ env.DOCKER_IMAGE_NAME }}-${{ matrix.environment }} -p ${{ matrix.environment == 'dev' && '3001:3000' || '3000:3000' }} ${{ env.DOCKER_IMAGE_NAME }}:${{ matrix.environment }}
