name: CI/CD Pipeline

on:
  push:

env:
  NODE_VERSION: '20'
  DOCKER_IMAGE_NAME: 'teddy-backend-api'

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache node modules
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm install

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Build project
        run: npm run build

      - name: Build Docker image
        run: docker build -t ${{ env.DOCKER_IMAGE_NAME }}:latest .

  deploy-dev:
    name: Deploy to Dev
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    environment: dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Get public IP
        run: echo "MY_IP=$(curl -s https://checkip.amazonaws.com)" >> $GITHUB_ENV

      - name: Generate SSH Key Pair for Terraform
        run: |
          mkdir -p ~/.ssh
          ssh-keygen -t rsa -b 4096 -f ~/.ssh/aws_key -N "" -C "github-actions"
          chmod 600 ~/.ssh/aws_key
          chmod 644 ~/.ssh/aws_key.pub
          echo "SSH_PUBLIC_KEY=$(cat ~/.ssh/aws_key.pub)" >> $GITHUB_ENV

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.6.0

      - name: Terraform Init
        run: terraform -chdir=./terraform/environments/dev init

      - name: Terraform Plan
        env:
          TF_VAR_ssh_public_key: ${{ env.SSH_PUBLIC_KEY }}
        run: |
          terraform -chdir=./terraform/environments/dev plan \
            -var "project_name=${{ secrets.PROJECT_NAME }}" \
            -var "environment=dev" \
            -var "aws_region=${{ secrets.AWS_REGION }}" \
            -var "db_username=${{ secrets.DB_USERNAME }}" \
            -var "db_password=${{ secrets.DB_PASSWORD }}" \
            -var "my_ip=$MY_IP" \
            -var "ssh_public_key=$SSH_PUBLIC_KEY" \

      - name: Terraform Apply
        env:
          TF_VAR_ssh_public_key: ${{ env.SSH_PUBLIC_KEY }}
        run: |
          terraform -chdir=./terraform/environments/dev apply \
            -var "project_name=${{ secrets.PROJECT_NAME }}" \
            -var "environment=dev" \
            -var "aws_region=${{ secrets.AWS_REGION }}" \
            -var "db_username=${{ secrets.DB_USERNAME }}" \
            -var "db_password=${{ secrets.DB_PASSWORD }}" \
            -var "my_ip=$MY_IP" \
            -var "ssh_public_key=$SSH_PUBLIC_KEY" \
            -auto-approve

      - name: Get EC2 IP and RDS Endpoint
        id: terraform_output
        run: |
          echo "ec2_ip=$(terraform -chdir=./terraform/environments/dev output -raw ec2_public_ip)" >> $GITHUB_OUTPUT
          echo "rds_endpoint=$(terraform -chdir=./terraform/environments/dev output -raw rds_endpoint)" >> $GITHUB_OUTPUT

      - name: Setup SSH
        run: |
          # A chave privada já foi gerada no step "Generate SSH Key Pair"
          ssh-keyscan -H ${{ steps.terraform_output.outputs.ec2_ip }} >> ~/.ssh/known_hosts
          # Aguardar EC2 estar pronta para SSH (pode levar alguns segundos após criação)
          echo "Aguardando EC2 estar pronta para SSH..."
          for i in {1..30}; do
            if ssh -i ~/.ssh/aws_key -o ConnectTimeout=5 -o StrictHostKeyChecking=no ec2-user@${{ steps.terraform_output.outputs.ec2_ip }} "echo 'EC2 pronta!'" 2>/dev/null; then
              echo "EC2 está pronta!"
              break
            fi
            echo "Tentativa $i/30 - aguardando..."
            sleep 10
          done

      - name: Deploy to EC2
        env:
          EC2_IP: ${{ steps.terraform_output.outputs.ec2_ip }}
          RDS_ENDPOINT: ${{ steps.terraform_output.outputs.rds_endpoint }}
          DATABASE_USER: ${{ secrets.DB_USERNAME }}
          DATABASE_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DATABASE_NAME: ${{ secrets.DATABASE_NAME || 'teddydb' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          # Criar .env no EC2
          ssh -i ~/.ssh/aws_key ec2-user@${EC2_IP} "mkdir -p /home/ec2-user/app && cat > /home/ec2-user/app/.env << EOF
          NODE_ENV=production
          PORT=3000
          BASE_URL=http://${EC2_IP}:3000
          DATABASE_HOST=${RDS_ENDPOINT}
          DATABASE_PORT=5432
          DATABASE_USER=${DATABASE_USER}
          DATABASE_PASSWORD=${DATABASE_PASSWORD}
          DATABASE_NAME=${DATABASE_NAME}
          JWT_SECRET=${JWT_SECRET}
          JWT_EXPIRES_IN=1d
          EOF"
          
          # Enviar código
          tar --exclude='node_modules' --exclude='.git' --exclude='coverage' --exclude='dist' --exclude='.terraform' -czf deploy.tar.gz .
          scp -i ~/.ssh/aws_key -o StrictHostKeyChecking=no deploy.tar.gz docker-compose.prod.yml ec2-user@${EC2_IP}:/home/ec2-user/app/
          
          # Deploy no EC2
          ssh -i ~/.ssh/aws_key -o StrictHostKeyChecking=no ec2-user@${EC2_IP} << 'DEPLOY_SCRIPT'
            set -e
            cd /home/ec2-user/app
            tar -xzf deploy.tar.gz
            rm deploy.tar.gz
            # Garantir que Docker está rodando
            sudo systemctl start docker || true
            docker-compose -f docker-compose.prod.yml down || true
            docker-compose -f docker-compose.prod.yml up -d --build
            docker image prune -f
            # Verificar se container está rodando
            sleep 10
            docker ps
          DEPLOY_SCRIPT
          
          echo "✅ Deploy concluído! API disponível em: http://${EC2_IP}:3000"

  deploy-prod:
    name: Deploy to Prod
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: prod

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Get public IP
        run: echo "MY_IP=$(curl -s https://checkip.amazonaws.com)" >> $GITHUB_ENV

      - name: Generate SSH Key Pair for Terraform
        run: |
          mkdir -p ~/.ssh
          ssh-keygen -t rsa -b 4096 -f ~/.ssh/aws_key -N "" -C "github-actions"
          chmod 600 ~/.ssh/aws_key
          chmod 644 ~/.ssh/aws_key.pub
          echo "SSH_PUBLIC_KEY=$(cat ~/.ssh/aws_key.pub)" >> $GITHUB_ENV

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.6.0

      - name: Terraform Init
        run: terraform -chdir=./terraform/environments/prod init

      - name: Terraform Plan
        env:
          TF_VAR_ssh_public_key: ${{ env.SSH_PUBLIC_KEY }}
        run: |
          terraform -chdir=./terraform/environments/prod plan \
            -var "project_name=${{ secrets.PROJECT_NAME }}" \
            -var "environment=prod" \
            -var "aws_region=${{ secrets.AWS_REGION }}" \
            -var "db_username=${{ secrets.DB_USERNAME }}" \
            -var "db_password=${{ secrets.DB_PASSWORD }}" \
            -var "my_ip=$MY_IP" \
            -var "ssh_public_key=$SSH_PUBLIC_KEY" \

      - name: Terraform Apply
        env:
          TF_VAR_ssh_public_key: ${{ env.SSH_PUBLIC_KEY }}
        run: |
          terraform -chdir=./terraform/environments/prod apply \
            -var "project_name=${{ secrets.PROJECT_NAME }}" \
            -var "environment=prod" \
            -var "aws_region=${{ secrets.AWS_REGION }}" \
            -var "db_username=${{ secrets.DB_USERNAME }}" \
            -var "db_password=${{ secrets.DB_PASSWORD }}" \
            -var "my_ip=$MY_IP" \
            -var "ssh_public_key=$SSH_PUBLIC_KEY" \
            -auto-approve

      - name: Get EC2 IP and RDS Endpoint
        id: terraform_output
        run: |
          echo "ec2_ip=$(terraform -chdir=./terraform/environments/prod output -raw ec2_public_ip)" >> $GITHUB_OUTPUT
          echo "rds_endpoint=$(terraform -chdir=./terraform/environments/prod output -raw rds_endpoint)" >> $GITHUB_OUTPUT

      - name: Setup SSH
        run: |
          # A chave privada já foi gerada no step "Generate SSH Key Pair"
          ssh-keyscan -H ${{ steps.terraform_output.outputs.ec2_ip }} >> ~/.ssh/known_hosts
          # Aguardar EC2 estar pronta para SSH (pode levar alguns segundos após criação)
          echo "Aguardando EC2 estar pronta para SSH..."
          for i in {1..30}; do
            if ssh -i ~/.ssh/aws_key -o ConnectTimeout=5 -o StrictHostKeyChecking=no ec2-user@${{ steps.terraform_output.outputs.ec2_ip }} "echo 'EC2 pronta!'" 2>/dev/null; then
              echo "EC2 está pronta!"
              break
            fi
            echo "Tentativa $i/30 - aguardando..."
            sleep 10
          done

      - name: Deploy to EC2
        env:
          EC2_IP: ${{ steps.terraform_output.outputs.ec2_ip }}
          RDS_ENDPOINT: ${{ steps.terraform_output.outputs.rds_endpoint }}
          DATABASE_USER: ${{ secrets.DB_USERNAME }}
          DATABASE_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DATABASE_NAME: ${{ secrets.DATABASE_NAME || 'teddydb' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          # Criar .env no EC2
          ssh -i ~/.ssh/aws_key ec2-user@${EC2_IP} "mkdir -p /home/ec2-user/app && cat > /home/ec2-user/app/.env << EOF
          NODE_ENV=production
          PORT=3000
          BASE_URL=http://${EC2_IP}:3000
          DATABASE_HOST=${RDS_ENDPOINT}
          DATABASE_PORT=5432
          DATABASE_USER=${DATABASE_USER}
          DATABASE_PASSWORD=${DATABASE_PASSWORD}
          DATABASE_NAME=${DATABASE_NAME}
          JWT_SECRET=${JWT_SECRET}
          JWT_EXPIRES_IN=1d
          EOF"
          
          # Enviar código
          tar --exclude='node_modules' --exclude='.git' --exclude='coverage' --exclude='dist' --exclude='.terraform' -czf deploy.tar.gz .
          scp -i ~/.ssh/aws_key -o StrictHostKeyChecking=no deploy.tar.gz docker-compose.prod.yml ec2-user@${EC2_IP}:/home/ec2-user/app/
          
          # Deploy no EC2
          ssh -i ~/.ssh/aws_key -o StrictHostKeyChecking=no ec2-user@${EC2_IP} << 'DEPLOY_SCRIPT'
            set -e
            cd /home/ec2-user/app
            tar -xzf deploy.tar.gz
            rm deploy.tar.gz
            # Garantir que Docker está rodando
            sudo systemctl start docker || true
            docker-compose -f docker-compose.prod.yml down || true
            docker-compose -f docker-compose.prod.yml up -d --build
            docker image prune -f
            # Verificar se container está rodando
            sleep 10
            docker ps
          DEPLOY_SCRIPT
          
          echo "✅ Deploy concluído! API disponível em: http://${EC2_IP}:3000"