name: CI/CD Prod

on:
  push:
    branches:
      - prod

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      DATABASE_USER: ${{ secrets.PROD_DB_USER }}
      DATABASE_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
      DATABASE_NAME: ${{ secrets.PROD_DB_NAME }}

    # Banco de testes local ou conexão com RDS (para integração com cloud)

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build production Docker image
        run: docker build -f Dockerfile -t teddy-backend-app-prod .

      # Opcional: Deploy para ambiente de produção (Docker Registry, AWS ECS, etc.)
      # - name: Deploy to Production
      #   run: echo "Deploy step ou scripts customizados aqui"

